name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: jellyfin-tui-linux-x86_64.tar.gz
          - os: macos-latest
            asset: jellyfin-tui-macos-aarch64.tar.gz
          - os: macos-13
            asset: jellyfin-tui-macos-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev libdbus-1-dev libssl-dev pkg-config

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        run: tar czf ${{ matrix.asset }} -C target/release jellyfin-tui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            > **Note:** [mpv](https://mpv.io/) is a runtime dependency and must be installed separately.
          files: artifacts/*.tar.gz
