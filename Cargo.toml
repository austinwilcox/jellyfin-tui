[package]
name = "jellyfin-tui"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A TUI music player for Jellyfin"
repository = "https://github.com/austinwilcox/jellyfin-tui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
libmpv2 = "4"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
souvlaki = "0.7"
unicode-width = "0.2"
